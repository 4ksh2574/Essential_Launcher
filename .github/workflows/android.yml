name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AX Home
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AX Home source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply AX Home identity
        run: python3 scripts/prepare_launcher.py

      - name: Commit AX Home source branding
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add launcher-core/build.gradle launcher-core/lawnchair/res/values*/strings.xml
          if git diff --cached --quiet; then
            echo "AX Home source branding is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply AX Home source branding"
          git push origin HEAD:main

      - name: Build debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
        working-directory: launcher-core
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease
        working-directory: launcher-core
        if: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find launcher-core/build/outputs/apk -type f -name 'AXHome*.apk' -print -exec cp {} dist/ \;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: AXHome-${{ github.ref_name }}
          path: dist/AXHome*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged APK release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: AX Home ${{ github.ref_name }}
          files: dist/AXHome*.apk
          generate_release_notes: true
