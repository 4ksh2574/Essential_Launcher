name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          for i in {1..20}; do echo y; done > "$RUNNER_TEMP/android-sdk-licenses.txt"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < "$RUNNER_TEMP/android-sdk-licenses.txt"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Set APK filename
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "APK_NAME=EssentialLauncher${VERSION}.apk" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "EssentialLauncher${VERSION}.apk"

      - name: Create GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: EssentialLauncher ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.APK_NAME }}

      - name: Upload named APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: EssentialLauncher1.0.0
          path: EssentialLauncher1.0.0.apk
          if-no-files-found: error
          retention-days: 14
