name: Essential Launcher Android build
run-name: Essential Launcher Android build (\${{ github.ref_name }})

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Essential Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Essential Launcher source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Essential Launcher identity
        run: python3 scripts/prepare_launcher.py

      - name: Build release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease
        working-directory: launcher-core

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find launcher-core/build/outputs/apk -type f -name 'EssentialLauncher*.apk' -print -exec cp {} dist/ \\;
          test -n "$(find dist -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: EssentialLauncher-\${{ github.ref_name }}
          path: dist/EssentialLauncher*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release metadata
        id: release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
            VERSION="\${VERSION#v}"
          else
            VERSION="$(sed -n 's/^version=//p' launcher.properties)"
          fi
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=Essential Launcher $VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ steps.release.outputs.tag_name }}
          target_commitish: \${{ github.sha }}
          name: \${{ steps.release.outputs.release_name }}
          files: dist/EssentialLauncher*.apk
          generate_release_notes: true
